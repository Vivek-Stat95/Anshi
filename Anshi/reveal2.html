
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Few more things</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #fff0f6, #ffd6e8);
  font-family: 'Comic Sans MS', cursive, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* MAIN CONTENT */
.wrapper {
  max-width: 1100px;
  width: 90%;
  text-align: center;
}

.h3 {
  color: #ff6fa8;
}

.h3 h3 {
  margin: 8px 0;
}

.subtitle {
  color: #7a003c;
  margin-bottom: 35px;
  font-size: 16px;
}

/* GALLERY */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 24px;
}

.card {
  background: linear-gradient(180deg, #ffffff, #ffe6f2);
  border-radius: 22px;
  padding: 10px;
  box-shadow:
    0 10px 30px rgba(255, 105, 180, 0.35),
    inset 0 0 12px rgba(255, 255, 255, 0.7);
  transition: transform 0.4s ease, box-shadow 0.4s ease;
}

.card:hover {
  transform: translateY(-10px) scale(1.05);
  box-shadow: 0 22px 45px rgba(255, 60, 150, 0.55);
}

.card img {
  width: 100%;
  border-radius: 18px;
  object-fit: cover;
}

.caption {
  margin-top: 10px;
  color: #5a0033;
  font-size: 14px;
  line-height: 1.4;
}

/* NEXT BUTTON */
#nextBtn {
  display: block;
  margin-top: 35px;
  margin-bottom: 20px;
}

#nextBtn button {
  padding: 14px 36px;
  font-size: 16px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(90deg, #ff7abf, #ff3d9a);
  color: white;
  cursor: pointer;
  box-shadow: 0 10px 25px rgba(255, 105, 180, 0.45);
  font-family: 'Comic Sans MS', cursive, sans-serif;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

#nextBtn button:hover {
  transform: translateY(-3px) scale(1.05);
  box-shadow: 0 15px 30px rgba(255, 60, 150, 0.55);
}

/* MOBILE */
@media (max-width: 600px) {
  .h3 h3 {
    font-size: 18px;
  }

  .gallery {
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .caption {
    font-size: 13px;
  }

  #nextBtn button {
    padding: 13px 30px;
  }
}
</style>
</head>

<body>

<!-- MAIN CONTENT -->
<div class="wrapper">

  <div class="h3">
    <h3>Not flirting though</h3>
    <h3>खूबसूरती दूसरी चीज है पहली आप हैं</h3>
  </div>

  <div class="subtitle"></div>

  <!-- GALLERY -->
  <div class="gallery">

    <div class="card">
      <img src="img1.png" alt="Photo 1">
      <div class="caption">
        If you ever find me looking at you it will always be NIHARANA
      </div>
    </div>

    <div class="card">
      <img src="img2.png" alt="Photo 2">
      <div class="caption">
        BTW this is how I used to see you in offc
      </div>
    </div>

    <div class="card">
      <img src="img3.jpeg" alt="Photo 3">
      <div class="caption">
        No rizz but I'll learn about things you like so we can talk abt it together.
      </div>
    </div>

  </div>

  <!-- NEXT BUTTON -->
  <div id="nextBtn">
    <button onclick="location.href='note.html'">
      I have a note for you. 💌
    </button>
  </div>

</div>

</body>
</html>
